{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ personal_info.name }} — {{ personal_info.role }}</title>
  
  <!-- Meta Tags -->
  <meta name="description" content="Portfolio of Mayuri Chourase, a Computer Science Graduate specializing in Python, SQL, AWS, Django, React.js, and Cloud technologies." />
  <meta name="keywords" content="Mayuri Chourase, Software Developer, Computer Science, Python, Django, React.js, AWS, SQL, Code Crew, EchoSphere, IntelliQuest" />
  <meta name="author" content="{{ personal_info.name }}" />
  <meta name="theme-color" content="#06080d" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Three.js 3D Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body class="relative min-h-screen bg-[#06080d] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 overflow-x-hidden">

  <!-- 3D WebGL Background Canvas Container -->
  <div id="three-bg-canvas" class="fixed inset-0 pointer-events-none z-0"></div>

  {% block content %}
  {% endblock %}

  <!-- Custom Scripts -->
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/three_scene.js' %}"></script>
</body>
</html>
